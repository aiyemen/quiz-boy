[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quizbot-arabic"
version = "1.0.0"
description = "Production-ready Telegram Quiz Bot with Quick Create, atomic batch parser, publishing permissions, quiz engine, results, and ranking abstraction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.4.1,<4.0.0",
    "sqlalchemy>=2.0.28,<3.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.2",
    "pytest-asyncio>=0.23.5"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
